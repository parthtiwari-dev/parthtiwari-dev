name: status

# Re-draws assets/status.svg once a day: is each thing I have shipped still up?
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/status.py
      - name: Commit if the picture changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status.svg
          git diff --cached --quiet || (git commit -m "status: refresh live check" && git push)
